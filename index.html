<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Silbertal Ranch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Vollbild-3D-Szene, HUD in den Ecken (Radar unten links, Geld oben rechts), Menüs als dunkle Lederpaneele mit Messing-Akzent */
:root {
  color-scheme: dark;
  --bg: #0d0f10; --panel: rgba(17, 19, 20, 0.9); --panel2: rgba(34, 37, 38, 0.92); --line: rgba(255, 244, 220, 0.14);
  --fg: #f1ece1; --dim: #a9a394; --brass: #e2b04a; --brass-ink: #1b1508; --cash: #86d977; --bad: #e0553d; --blue: #5aa7e8;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button, input, select { font: inherit; color: inherit; }
kbd { font-family: var(--display); font-weight: 700; background: var(--fg); color: #111; border-radius: 4px; padding: 0 6px; font-size: 0.95em; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; display: none; }
body.playing #hud { display: block; }
body.ui-open #hud > *:not(#toasts) { opacity: 0; }
#hud > * { transition: opacity 0.2s; }
#minimap { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; width: 176px; height: 176px; border-radius: 10px; overflow: hidden; border: 2px solid rgba(0, 0, 0, 0.75); box-shadow: 0 0 0 1px var(--line), 0 6px 20px rgba(0, 0, 0, 0.45); }
#minimap canvas { width: 100%; height: 100%; display: block; }
#hinfo { position: absolute; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 190px); bottom: 16px; min-width: 190px; font-family: var(--display); text-shadow: 0 1px 3px #000; }
#hname { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
#hgait { font-size: 26px; font-weight: 700; line-height: 1.05; }
#hspeed { font-size: 17px; color: var(--dim); font-variant-numeric: tabular-nums; }
#gaits { display: flex; gap: 3px; margin: 6px 0; }
#gaits span { width: 30px; height: 6px; background: rgba(0, 0, 0, 0.55); border-radius: 2px; }
#gaits span.on { background: var(--brass); }
#stam { width: 170px; height: 8px; background: rgba(0, 0, 0, 0.6); border-radius: 3px; overflow: hidden; }
#stam i { display: block; height: 100%; background: var(--blue); }
#stam.low i { background: var(--bad); }
#topright { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 14px; text-align: right; font-family: var(--display); text-shadow: 0 1px 3px #000, 0 0 12px rgba(0, 0, 0, 0.6); }
#money { font-size: 34px; font-weight: 700; color: var(--cash); line-height: 1; font-variant-numeric: tabular-nums; }
#clock { font-size: 17px; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
#menuBtn { pointer-events: auto; position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 20px; cursor: pointer; }
#prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; font-family: var(--display); font-size: 20px; font-weight: 600; white-space: nowrap; }
#toasts { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 70px; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, 80%); }
.toast { background: var(--panel); border-left: 4px solid var(--brass); padding: 9px 13px; border-radius: 4px; animation: tin 0.3s ease-out; transition: opacity 0.5s; line-height: 1.35; }
.toast.good { border-color: var(--cash); } .toast.bad { border-color: var(--bad); } .toast.out { opacity: 0; }
@keyframes tin { from { transform: translateX(-20px); opacity: 0; } }
#loc { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 18px; font-family: var(--display); font-size: 40px; font-weight: 700; font-style: italic; text-shadow: 0 2px 6px #000; opacity: 0; }
#loc.show { animation: loc 4.5s ease-out; }
@keyframes loc { 0% { opacity: 0; transform: translateY(10px); } 10%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#ev { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-family: var(--display); text-shadow: 0 2px 5px #000; }
#evMain { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
#evSub { font-size: 19px; font-weight: 600; color: var(--brass); }
#task { display: inline-block; margin-top: 6px; background: var(--panel); padding: 5px 14px; border-radius: 6px; font-family: var(--body); font-size: 15px; text-shadow: none; max-width: 92%; }
#task:empty { display: none; }
#msg { font-size: 30px; font-weight: 700; color: #ffd23a; min-height: 36px; margin-top: 6px; }
#count { position: absolute; left: 0; right: 0; top: 30vh; font-size: 110px; font-weight: 700; }
body.in-event #topright, body.in-event #menuBtn { display: none; }

/* Touch */
#touch, #joy { display: none; }
body.touch.playing #touch { display: block; }
#touch button { pointer-events: auto; position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); background: rgba(10, 10, 10, 0.4); font-family: var(--display); font-weight: 700; font-size: 15px; touch-action: none; }
#touch button.on { background: var(--brass); color: var(--brass-ink); }
#touch .r1 { right: max(18px, env(safe-area-inset-right, 0px)); } #touch .r2 { right: calc(max(18px, env(safe-area-inset-right, 0px)) + 70px); } #touch .r3 { right: calc(max(18px, env(safe-area-inset-right, 0px)) + 140px); }
#touch .b1 { bottom: 22px; } #touch .b2 { bottom: 92px; } #touch .b3 { bottom: 162px; }
#touch .ride { display: none; } body.riding #touch .ride { display: block; }
body.touch #joy { display: block; position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); background: rgba(0, 0, 0, 0.2); pointer-events: none; }
#joy i { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
body.touch #hinfo { left: max(16px, env(safe-area-inset-left, 0px)); bottom: auto; top: 118px; }
body.touch #minimap { bottom: auto; top: 66px; left: auto; right: max(16px, env(safe-area-inset-right, 0px)); width: 120px; height: 120px; }
body.touch #topright { top: 10px; } body.touch #money { font-size: 26px; } body.touch #toasts { top: 66px; max-width: 56%; } body.touch #prompt kbd { display: none; }
body.touch #loc { font-size: 26px; right: auto; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 14px; }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
#fade.on { opacity: 1; }

/* ---------- Menüs ---------- */
#screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 7, 8, 0.62); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); -webkit-user-select: text; user-select: text; }
#screen.on { display: flex; }
#screen.clear { background: linear-gradient(90deg, rgba(6, 7, 8, 0.55), rgba(6, 7, 8, 0) 60%); }
#screen.left { justify-content: flex-start; align-items: stretch; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.05; }
h2 { font-size: 30px; font-weight: 700; } h2 small, h3 small { font-size: 15px; color: var(--dim); font-weight: 500; margin-left: 8px; }
h3 { font-size: 17px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brass); margin-top: 6px; font-weight: 600; }
.panel, .side, .phone { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; gap: 12px; padding: 18px; max-height: 100%; overflow-y: auto; min-width: 0; }
.panel { width: min(980px, 100%); } .panel.narrow { width: min(620px, 100%); }
.side { width: min(400px, 100%); } .side.wide { width: min(430px, 100%); }
.phone { width: min(420px, 100%); border-radius: 26px; border: 3px solid #2c2e30; }
.ph-top { display: flex; justify-content: space-between; font-family: var(--display); font-size: 17px; color: var(--dim); font-variant-numeric: tabular-nums; }
#bigmap { width: 100%; height: auto; border-radius: 10px; display: block; }
button { cursor: pointer; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 9px 14px; font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: 0.02em; min-height: 40px; }
button:hover:not(:disabled) { border-color: var(--brass); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
button.pri { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
button.bad { color: var(--bad); }
button.big { font-size: 24px; padding: 12px 26px; min-width: 240px; text-align: left; }
.row { display: flex; gap: 8px; align-items: center; } .row.end { justify-content: flex-end; margin-top: auto; padding-top: 6px; } .row.wrap, .seg.wrap { flex-wrap: wrap; }
label { display: flex; flex-direction: column; gap: 5px; font-family: var(--display); font-size: 14px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--dim); font-weight: 600; }
input[type=text], input:not([type]), select { background: #0b0c0d; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; font-family: var(--body); font-size: 16px; color: var(--fg); text-transform: none; letter-spacing: 0; width: 100%; }
input[type=range] { width: 100%; accent-color: var(--brass); }
.sw { display: flex; gap: 6px; flex-wrap: wrap; } .sw button { width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.5); }
.sw button.on { outline: 2px solid var(--brass); outline-offset: 2px; }
.seg { display: flex; gap: 4px; } .seg button { flex: 1; padding: 7px 6px; font-size: 15px; min-height: 36px; white-space: nowrap; } .seg button.on, .tabs button.on { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.desc { margin: 0; color: var(--dim); line-height: 1.45; font-size: 14.5px; } .desc b { color: var(--fg); }
.hint { margin: 0; color: var(--dim); font-size: 13px; } .warn { margin: 0; color: var(--bad); font-weight: 600; }
.g { color: var(--cash); } .price { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--cash); } .price.bad { color: var(--bad); }
.cash { font-family: var(--display); font-size: 24px; color: var(--cash); font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-direction: column; gap: 5px; }
.st { display: grid; grid-template-columns: 96px 1fr 30px; gap: 8px; align-items: center; font-size: 13.5px; }
.st em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
.bar { position: relative; height: 9px; background: #0a0b0c; border-radius: 3px; }
.bar i { display: block; height: 100%; background: var(--brass); border-radius: 3px; } .bar.low i { background: var(--bad); }
.bar b { position: absolute; top: -2px; width: 2px; height: 13px; background: var(--fg); }
.tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; } .tabs .sp { flex: 1; } .ttl { font-family: var(--display); font-size: 26px; }
.split { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; min-height: 0; }
.list { display: flex; flex-direction: column; gap: 6px; min-width: 0; } .detail { display: flex; flex-direction: column; gap: 11px; min-width: 0; }
.hcard { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 8px 11px; min-width: 0; }
.hcard b { font-size: 18px; } .hcard span { font-family: var(--body); font-weight: 400; font-size: 12.5px; color: var(--dim); letter-spacing: 0; line-height: 1.3; }
.hcard.on { border-color: var(--brass); background: rgba(226, 176, 74, 0.14); }
.tag { font-style: normal; font-size: 12px; background: var(--brass); color: var(--brass-ink); border-radius: 3px; padding: 1px 5px; vertical-align: middle; } .tag.g { background: var(--cash); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; border: 1px solid rgba(255, 255, 255, 0.4); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.mcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mcard > b { font-family: var(--display); font-size: 22px; } .mcard > span { font-size: 12.5px; color: var(--dim); } .mcard.sold { opacity: 0.45; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .cols2 > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.keys { border-collapse: collapse; font-size: 14px; } .keys td { padding: 4px 8px 4px 0; vertical-align: top; } .keys td:first-child { white-space: nowrap; }
.res { text-align: center; } .res h1 { font-size: 54px; font-style: italic; } .res h1.win { color: var(--brass); } .res small { font-family: var(--display); font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.rank { width: 100%; border-collapse: collapse; text-align: left; font-variant-numeric: tabular-nums; } .rank td { padding: 5px 8px; border-bottom: 1px solid var(--line); } .rank tr.you td { background: rgba(226, 176, 74, 0.2); font-weight: 600; } .rank td:last-child { text-align: right; }
.title { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 1100px; }
.logo small { font-family: var(--display); letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); font-size: 16px; font-weight: 600; }
.logo h1 { font-size: clamp(64px, 13vw, 150px); font-weight: 700; font-style: italic; text-transform: uppercase; line-height: 0.84; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); letter-spacing: -0.01em; }
.logo h1 span { display: block; color: var(--brass); margin-left: 0.5em; }
.logo p { font-size: 18px; margin: 14px 0 0; text-shadow: 0 1px 6px #000; max-width: 34ch; }
.menu { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
@media (max-width: 760px) {
  .split, .cols2 { grid-template-columns: 1fr; } .list { max-height: 30vh; overflow-y: auto; }
  #screen.left { align-items: flex-end; justify-content: center; padding-block: 0; } .side, .side.wide { width: 100%; max-height: 54%; border-radius: 14px 14px 0 0; }
  #screen.clear { background: linear-gradient(0deg, rgba(6, 7, 8, 0.6), rgba(6, 7, 8, 0) 70%); }
  .st { grid-template-columns: 84px 1fr 28px; } #evMain { font-size: 34px; } #msg { font-size: 22px; } #count { font-size: 72px; }
}
@media (prefers-reduced-motion: reduce) { .toast, #loc.show { animation-duration: 0.01s; } #loc.show { opacity: 1; } }
</style>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Spielansicht"></canvas>
  <div id="hud">
    <button id="menuBtn" aria-label="Handy öffnen">☰</button>
    <div id="topright"><div id="money">$0</div><div id="clock"></div></div>
    <div id="minimap"><canvas width="176" height="176"></canvas></div>
    <div id="hinfo" hidden><div id="hname"></div><div id="hgait"></div><div id="gaits"><span></span><span></span><span></span><span></span><span></span></div><div id="hspeed"></div><div id="stam"><i></i></div></div>
    <div id="ev" hidden><div id="evMain"></div><div id="evSub"></div><div id="task"></div><div id="msg"></div><div id="count"></div></div>
    <div id="prompt" hidden></div>
    <div id="loc"></div>
    <div id="toasts"></div>
    <div id="joy" hidden><i></i></div>
    <div id="touch">
      <button class="r1 b1" data-k="KeyE">Aktion</button>
      <button class="r2 b1" data-k="Sprint">Tempo</button>
      <button class="r3 b1" data-k="KeyH">Pfiff</button>
      <button class="r1 b2 ride" data-k="Jump">Sprung</button>
      <button class="r1 b3 ride" data-k="GaitUp">▲</button>
      <button class="r2 b2 ride" data-k="GaitDown">▼</button>
      <button class="r2 b3 ride" data-k="Stop">Stopp</button>
    </div>
  </div>
  <div id="screen"></div>
  <div id="fade"></div>

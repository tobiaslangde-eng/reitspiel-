<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<base href="../">
<title>Pferde-Ansicht</title>
<style>html, body { margin: 0; background: #c9d3dc; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Dev tool: renders one horse from four angles to check the anatomy.
// tools/horse-viewer.html?breed=quarter&coat=fuchs&level=  (serve from the repo root)
import * as THREE from 'three';
import { randomHorse } from './src/horse/breeds.js';
import { loadHorseAssets, buildHorseModel } from './src/horse/horseModel.js';

const q = new URLSearchParams(location.search);
const level = q.get('level') ?? '';
await loadHorseAssets([level, '-lo']);
const W = 1600, H = 1000;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(W, H);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true;
r.setScissorTest(true);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d3dc);
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x5a4a38, 1.2));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(4, 6, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8c9a6c }));
ground.receiveShadow = true;
scene.add(ground);

const data = randomHorse(q.get('breed') || 'quarter', { coat: q.get('coat') || 'fuchs', markings: { socks: [0, 0, 0, 0], blaze: 0 } });
data.maneStyle = q.get('mane') || 'offen';
const rig = buildHorseModel(data);
rig.root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
rig.setLOD(0);
scene.add(rig.root);
for (const m of rig.mane) if (m.rest < 2) { m.g.rotation.x = m.rest; m.g.rotation.z = -0.7; }
for (const t of rig.tail) t.g.rotation.x = t.rest;
if (q.get('nohair')) { rig.maneGroup.visible = false; rig.tailFull.visible = false; if (rig.forelock) rig.forelock.visible = false; }

const views = [
  { x: 0, y: 0, w: 1000, h: 600, pos: [5.2, 1.15, 0.15], at: [0, 1.0, 0.15], fov: 30 },
  { x: 1000, y: 0, w: 600, h: 600, pos: [2.4, 1.5, 3.4], at: [0, 1.05, 0.2], fov: 35 },
  { x: 0, y: 600, w: 600, h: 400, pos: [-2.6, 1.4, -3.4], at: [0, 1.0, -0.2], fov: 32 },
  { x: 600, y: 600, w: 500, h: 400, pos: [1.3, 1.85, 2.0], at: [0, 1.62, 1.12], fov: 28 },
  { x: 1100, y: 600, w: 500, h: 400, pos: [0.02, 1.4, 4.2], at: [0, 1.05, 0], fov: 30 },
];
const cam = new THREE.PerspectiveCamera();
for (const v of views) {
  cam.fov = v.fov; cam.aspect = v.w / v.h; cam.near = 0.05; cam.far = 50; cam.updateProjectionMatrix();
  cam.position.set(...v.pos); cam.lookAt(...v.at);
  r.setViewport(v.x, H - v.y - v.h, v.w, v.h);
  r.setScissor(v.x, H - v.y - v.h, v.w, v.h);
  r.render(scene, cam);
}
window.rig = rig;
if (q.get('hl')) { rig.coatMat.userData.uniforms.uHeadLen.value = +q.get('hl'); r.setScissor(600, 0, 500, 400); r.setViewport(600, 0, 500, 400); cam.aspect = 1.25; cam.fov = 28; cam.updateProjectionMatrix(); cam.position.set(1.3, 1.85, 2.0); cam.lookAt(0, 1.62, 1.12); r.render(scene, cam); }
window.DONE = true;
</script>
</body>
</html>
